name: Release Automation

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 1. Cài đặt Chrome
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable

      - run: chmod +x scripts/*.sh
      - run: ./scripts/verify-tag.sh

      # 2. Chạy Maven Test truyền trực tiếp Binary & Headless Mode
      - name: Run UI Automation Tests
        run: |
          mvn -B clean verify \
            -Dheadless=true \
            -Dwebdriver.chrome.driver.binary="${{ steps.setup-chrome.outputs.chrome-path }}"

      - run: |
          ./scripts/package-release-assets.sh
          ./scripts/release-summary.sh
          ./scripts/verify-release-assets.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/**

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*